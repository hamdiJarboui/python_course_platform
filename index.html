<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PyCourses — learn Python by running code right in your browser." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>PyCourses — learn Python in your browser</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (ADR-005 / FR-6).
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('pycourses:theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved;
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-theme-mode', mode);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PyCourses needs JavaScript to run Python in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
