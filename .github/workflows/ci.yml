name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5 # real CPython for content:verify and the harness tests
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile

      # Order from docs/ARCHITECTURE.md §12: typecheck → lint → unit → content → build → e2e → pdf
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm content:build
      - run: pnpm content:verify
      - run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium

      # PDFs first: the PDF e2e spec and the "Download PDF" button need them.
      - run: pnpm pdf
      - run: pnpm e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            coverage/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: course-pdfs
          path: public/pdf/
          if-no-files-found: ignore
