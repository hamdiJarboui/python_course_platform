name: Deploy

# Publishes the static site (incl. generated PDFs) to GitHub Pages.
# Enable it once under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Project pages live under /<repo>/ — change to "/" for a custom domain.
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build && pnpm content:verify
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm pdf
      # Build again so dist/ contains public/pdf (Vite copies public/ at build time).
      - run: pnpm build
      # Pages has no SPA fallback: serve index.html for unknown paths so deep links work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
